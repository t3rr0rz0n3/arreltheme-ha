# Arrel · Graphite / Porcelain
# Las variables navbar-* se utilizan en custom:navbar-card.
Arrel:
  primary-color: '#425F93'
  accent-color: '#425F93'
  state-active-color: '#425F93'
  state-inactive-color: '#838894'
  error-color: '#BA3D4D'
  warning-color: '#956019'
  success-color: '#425F93'
  info-color: '#425F93'
  ha-card-border-radius: 16px
  ha-card-border-width: 1px
  ha-card-box-shadow: none
  modes:
    light:
      primary-color: '#425F93'
      accent-color: '#425F93'
      state-active-color: '#425F93'
      success-color: '#425F93'
      info-color: '#425F93'
      error-color: '#BA3D4D'
      warning-color: '#956019'
      primary-background-color: '#F3F2F0'
      secondary-background-color: '#EAE9E6'
      card-background-color: '#FDFCFA'
      ha-card-background: '#FDFCFA'
      ha-card-border-color: '#DADCE1'
      primary-text-color: '#20232B'
      secondary-text-color: '#626875'
      divider-color: '#DADCE1'
      app-header-background-color: '#F3F2F0'
      app-header-text-color: '#20232B'
      sidebar-background-color: '#F3F2F0'
      sidebar-text-color: '#20232B'
      sidebar-icon-color: '#626875'
      sidebar-selected-text-color: '#425F93'
      sidebar-selected-icon-color: '#425F93'
      arrel-navigation-active-background: '#E5EBF5'
      arrel-navigation-shadow: 0 8px 28px rgba(24, 29, 40, 0.08)
    dark:
      primary-color: '#A6BDE7'
      accent-color: '#A6BDE7'
      state-active-color: '#A6BDE7'
      success-color: '#A6BDE7'
      info-color: '#A6BDE7'
      error-color: '#FF8693'
      warning-color: '#E4B675'
      primary-background-color: '#111216'
      secondary-background-color: '#191B21'
      card-background-color: '#1C1F26'
      ha-card-background: '#1C1F26'
      ha-card-border-color: '#323640'
      primary-text-color: '#F0F1F5'
      secondary-text-color: '#ADB3C0'
      divider-color: '#323640'
      app-header-background-color: '#111216'
      app-header-text-color: '#F0F1F5'
      sidebar-background-color: '#111216'
      sidebar-text-color: '#F0F1F5'
      sidebar-icon-color: '#ADB3C0'
      sidebar-selected-text-color: '#A6BDE7'
      sidebar-selected-icon-color: '#A6BDE7'
      arrel-navigation-active-background: '#2C374D'
      arrel-navigation-shadow: 0 12px 32px rgba(0, 0, 0, 0.28)
  navbar-primary-color: var(--primary-color)
  navbar-background-color: var(--card-background-color)
  navbar-border-radius: 20px
  navbar-route-icon-size: 24px
  navbar-box-shadow: var(--arrel-navigation-shadow)
  navbar-box-shadow-desktop: var(--arrel-navigation-shadow)
  navbar-box-shadow-mobile-floating: var(--arrel-navigation-shadow)
