# Requiere Bubble Card >= 3.2.0 y Navbar Card.
# Los pop-ups de habitaciones pertenecen a Casa; sus hashes son únicos.
title: Arrel · Pruebas
navbar-templates:
  arrel_navigation:
    desktop:
      position: left
      mode: floating
      min_width: 1024
      show_labels: true
    mobile:
      mode: docked
      show_labels: true
      safe_area: true
    layout:
      auto_padding:
        enabled: true
        desktop_px: 112
        mobile_px: 112
    routes:
    - url: /arrel-pruebas/casa
      icon: mdi:home-outline
      icon_selected: mdi:home
      label: Casa
    - url: /arrel-pruebas/luces
      icon: mdi:lightbulb-outline
      icon_selected: mdi:lightbulb
      label: Luces
    - url: /arrel-pruebas/confort
      icon: mdi:thermometer
      icon_selected: mdi:thermometer
      label: Confort
    - url: /arrel-pruebas/laboratorio
      icon: mdi:tune-variant
      icon_selected: mdi:tune
      label: Pruebas
    styles: |
      /* Los colores proceden del tema Arrel en ambos modos. */
      .navbar-card {
        border: 1px solid var(--ha-card-border-color);
      }
      .navbar-card.mobile {
        border-radius: 20px 20px 0 0;
      }
      .route {
        min-width: 48px;
        min-height: 48px;
      }
      .route .button {
        border-radius: 12px;
      }
      .route .button.active {
        background: var(--arrel-navigation-active-background, var(--secondary-background-color));
      }
      .label {
        color: var(--secondary-text-color);
        font-size: 12px;
        font-weight: 500;
      }
      .label.active {
        color: var(--primary-color);
        font-weight: 600;
      }
      .route:focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .navbar-card, .route, .button, .icon, .label {
          transition: none !important;
          animation: none !important;
        }
      }
views:
- title: Casa
  path: casa
  type: sections
  max_columns: 2
  theme: Arrel
  sections:
  - type: grid
    cards:
    - type: custom:navbar-card
      template: arrel_navigation
    - type: markdown
      content: |
        # Tu casa, de un vistazo
        {% set luces = ['input_boolean.arrel_demo_luz_salon', 'input_boolean.arrel_demo_luz_cocina', 'input_boolean.arrel_demo_luz_dormitorio'] %}
        **{{ expand(luces) | selectattr('state', 'eq', 'on') | list | count }} luces encendidas** · {{ states('input_number.arrel_demo_temperatura') }} °C · {{ states('input_select.arrel_demo_modo') }}
    - type: custom:bubble-card
      card_type: select
      entity: input_select.arrel_demo_modo
      name: Modo de la casa
      icon: mdi:home-outline
    - type: conditional
      conditions:
      - entity: input_boolean.arrel_demo_ventana
        state: 'on'
      card:
        type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.arrel_demo_ventana
        name: Ventana abierta · Salón
        show_state: true
        scrolling_effect: false
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Habitaciones
      icon: mdi:floor-plan
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Salón
      icon: mdi:sofa-outline
      scrolling_effect: false
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#salon'
      tap_action:
        action: navigate
        navigation_path: '#salon'
      sub_button:
      - entity: input_boolean.arrel_demo_luz_salon
        name: Luz
        icon: mdi:lightbulb-outline
        show_name: true
        tap_action:
          action: toggle
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Cocina
      icon: mdi:countertop-outline
      scrolling_effect: false
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#cocina'
      tap_action:
        action: navigate
        navigation_path: '#cocina'
      sub_button:
      - entity: input_boolean.arrel_demo_luz_cocina
        name: Luz
        icon: mdi:lightbulb-outline
        show_name: true
        tap_action:
          action: toggle
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Dormitorio
      icon: mdi:bed-outline
      scrolling_effect: false
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#dormitorio'
      tap_action:
        action: navigate
        navigation_path: '#dormitorio'
      sub_button:
      - entity: input_boolean.arrel_demo_luz_dormitorio
        name: Luz
        icon: mdi:lightbulb-outline
        show_name: true
        tap_action:
          action: toggle
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#salon'
      name: Salón
      icon: mdi:sofa-outline
      show_close_button: true
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Iluminación
        icon: mdi:lightbulb-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.arrel_demo_luz_salon
        name: Luz principal
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
        button_action:
          tap_action:
            action: toggle
      - type: custom:bubble-card
        card_type: separator
        name: Ambiente
        icon: mdi:thermometer
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_number.arrel_demo_temperatura
        name: Temperatura
        show_state: true
        scrolling_effect: false
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: input_number.arrel_demo_consigna
        name: Temperatura deseada
        show_state: true
        scrolling_effect: false
        slider_live_update: false
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: input_number.arrel_demo_persiana
        name: Apertura de persiana
        show_state: true
        scrolling_effect: false
        slider_live_update: false
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.arrel_demo_ventana
        name: Ventana
        show_state: true
        scrolling_effect: false
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#cocina'
      name: Cocina
      icon: mdi:countertop-outline
      show_close_button: true
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Iluminación
        icon: mdi:lightbulb-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.arrel_demo_luz_cocina
        name: Luz principal
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
        button_action:
          tap_action:
            action: toggle
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#dormitorio'
      name: Dormitorio
      icon: mdi:bed-outline
      show_close_button: true
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Iluminación
        icon: mdi:lightbulb-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.arrel_demo_luz_dormitorio
        name: Luz principal
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
        button_action:
          tap_action:
            action: toggle
