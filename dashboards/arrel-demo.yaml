# Requiere Bubble Card >= 3.2.0, Navbar Card y Mushroom >= 5.
# Si cambia la URL del dashboard, ajustar navbar y acciones Mushroom.
title: Arrel · Pruebas
navbar-templates:
  arrel_navigation:
    desktop:
      position: left
      mode: floating
      min_width: 1024
      show_labels: true
    mobile:
      mode: docked
      show_labels: true
      safe_area: true
    layout:
      auto_padding:
        enabled: true
        desktop_px: 112
        mobile_px: 112
    routes:
    - url: /arrel-pruebas/casa
      icon: mdi:home-outline
      icon_selected: mdi:home
      label: Casa
    - url: /arrel-pruebas/luces
      icon: mdi:lightbulb-outline
      icon_selected: mdi:lightbulb
      label: Luces
    - url: /arrel-pruebas/confort
      icon: mdi:thermometer
      icon_selected: mdi:thermometer
      label: Confort
    - url: /arrel-pruebas/laboratorio
      icon: mdi:tune-variant
      icon_selected: mdi:tune
      label: Pruebas
    styles: |
      /* Arrel: mismos fondos y radios que las habitaciones. */
      .navbar-card,
      .navbar-card.desktop,
      .navbar-card.mobile,
      .media-player {
        background: var(--arrel-room-background, var(--card-background-color));
        border: none;
        border-radius: 24px;
        box-shadow: none;
      }
      .navbar-card {
        --navbar-route-icon-size: 25px;
      }
      .route {
        min-width: 48px;
        min-height: 48px;
      }
      .button,
      .popup-item .button {
        border-radius: 16px;
        background: var(--arrel-room-icon-background, var(--secondary-background-color));
        box-shadow: none;
      }
      .button.active {
        background: var(--arrel-navigation-active-background, var(--secondary-background-color));
      }
      .icon {
        color: var(--primary-text-color);
      }
      .icon.active {
        color: var(--primary-color);
      }
      .label {
        color: var(--secondary-text-color);
        font-size: 12px;
        font-weight: 500;
      }
      .label.active {
        color: var(--primary-color);
        font-weight: 600;
      }
      .popup-item.popuplabelbackground .label {
        background: var(--arrel-room-background, var(--card-background-color));
        border-radius: 16px;
        box-shadow: none;
      }
      .media-player-progress-bar {
        background: var(--arrel-slider-track-background, var(--secondary-background-color));
        box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18));
      }
      .route:focus-visible,
      .button:focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .navbar-card, .route, .button, .icon, .label {
          transition: none !important;
          animation: none !important;
        }
      }

views:
- title: Casa
  path: casa
  type: sections
  max_columns: 2
  theme: Arrel
  sections:
  - type: grid
    cards:
    - type: custom:navbar-card
      template: arrel_navigation
    - type: custom:mushroom-template-card
      primary: Tu casa, de un vistazo
      secondary: |-
        {% set luces = ['input_boolean.arrel_demo_luz_salon', 'input_boolean.arrel_demo_luz_cocina', 'input_boolean.arrel_demo_luz_dormitorio'] %}
        {% set encendidas = expand(luces) | selectattr('state', 'eq', 'on') | list | count %}
        {% set sin_datos = expand(luces) | rejectattr('state', 'in', ['on', 'off']) | list | count %}
        {{ encendidas }} luces encendidas{% if sin_datos %} · {{ sin_datos }} sin datos{% endif %}
        {{ states('input_select.arrel_demo_modo') }} · {{ states('input_number.arrel_demo_temperatura') }} °C
      icon: mdi:home-outline
      color: primary
      multiline_secondary: true
      entity_id:
      - input_boolean.arrel_demo_luz_salon
      - input_boolean.arrel_demo_luz_cocina
      - input_boolean.arrel_demo_luz_dormitorio
      - input_select.arrel_demo_modo
      - input_number.arrel_demo_temperatura
      tap_action:
        action: navigate
        navigation_path: /arrel-pruebas/luces
      icon_tap_action:
        action: navigate
        navigation_path: /arrel-pruebas/luces
    - type: custom:bubble-card
      card_type: select
      entity: input_select.arrel_demo_modo
      name: Modo de la casa
      icon: mdi:home-outline
    - type: custom:mushroom-template-card
      entity: input_boolean.arrel_demo_ventana
      primary: '{% if is_state(entity, ''on'') %}Ventana abierta{% elif is_state(entity,
        ''off'') %}Ventana cerrada{% else %}Ventana sin datos{% endif %}'
      secondary: Salón · Abrir controles
      icon: '{{ ''mdi:window-open-variant'' if is_state(entity, ''on'') else ''mdi:window-closed-variant''
        }}'
      color: '{% if is_state(entity, ''on'') %}var(--warning-color){% elif is_state(entity,
        ''off'') %}primary{% else %}disabled{% endif %}'
      tap_action:
        action: navigate
        navigation_path: '#salon'
      icon_tap_action:
        action: navigate
        navigation_path: '#salon'
      hold_action:
        action: more-info
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Habitaciones
      icon: mdi:floor-plan
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Salón
      icon: mdi:sofa-outline
      scrolling_effect: false
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#salon'
      tap_action:
        action: navigate
        navigation_path: '#salon'
      sub_button:
      - entity: input_boolean.arrel_demo_luz_salon
        name: Luz
        icon: mdi:lightbulb-outline
        show_name: true
        tap_action:
          action: toggle
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Cocina
      icon: mdi:countertop-outline
      scrolling_effect: false
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#cocina'
      tap_action:
        action: navigate
        navigation_path: '#cocina'
      sub_button:
      - entity: input_boolean.arrel_demo_luz_cocina
        name: Luz
        icon: mdi:lightbulb-outline
        show_name: true
        tap_action:
          action: toggle
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Dormitorio
      icon: mdi:bed-outline
      scrolling_effect: false
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#dormitorio'
      tap_action:
        action: navigate
        navigation_path: '#dormitorio'
      sub_button:
      - entity: input_boolean.arrel_demo_luz_dormitorio
        name: Luz
        icon: mdi:lightbulb-outline
        show_name: true
        tap_action:
          action: toggle
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#salon'
      name: Salón
      icon: mdi:sofa-outline
      show_close_button: true
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Iluminación
        icon: mdi:lightbulb-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.arrel_demo_luz_salon
        name: Luz principal
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
        button_action:
          tap_action:
            action: toggle
      - type: custom:bubble-card
        card_type: separator
        name: Ambiente
        icon: mdi:thermometer
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_number.arrel_demo_temperatura
        name: Temperatura
        show_state: true
        scrolling_effect: false
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        slider_value_position: right
        styles: |
          .bubble-button-card-container {
            background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important;
            box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important;
          }
        entity: input_number.arrel_demo_consigna
        name: Temperatura deseada
        show_state: true
        scrolling_effect: false
        slider_live_update: false
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        slider_value_position: right
        styles: |
          .bubble-button-card-container {
            background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important;
            box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important;
          }
        entity: input_number.arrel_demo_persiana
        name: Apertura de persiana
        show_state: true
        scrolling_effect: false
        slider_live_update: false
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: input_boolean.arrel_demo_ventana
        name: Ventana
        show_state: true
        scrolling_effect: false
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#cocina'
      name: Cocina
      icon: mdi:countertop-outline
      show_close_button: true
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Iluminación
        icon: mdi:lightbulb-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.arrel_demo_luz_cocina
        name: Luz principal
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
        button_action:
          tap_action:
            action: toggle
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#dormitorio'
      name: Dormitorio
      icon: mdi:bed-outline
      show_close_button: true
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Iluminación
        icon: mdi:lightbulb-outline
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: input_boolean.arrel_demo_luz_dormitorio
        name: Luz principal
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
        button_action:
          tap_action:
            action: toggle
