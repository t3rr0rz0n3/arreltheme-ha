# Navbar independiente: pega en una tarjeta manual y cambia routes.
# Si ya tienes navbar, copia SOLO styles a su YAML y conserva rutas y posición.
# Requiere Navbar Card; selecciona el tema Arrel.
type: custom:navbar-card
desktop:
  position: left
  mode: floating
  min_width: 1024
  show_labels: true
mobile:
  mode: docked
  show_labels: true
  safe_area: true
layout:
  auto_padding:
    enabled: true
    desktop_px: 112
    mobile_px: 112
routes:
- url: /arrel-pruebas/casa
  icon: mdi:home-outline
  icon_selected: mdi:home
  label: Casa
- url: /arrel-pruebas/luces
  icon: mdi:lightbulb-outline
  icon_selected: mdi:lightbulb
  label: Luces
- url: /arrel-pruebas/confort
  icon: mdi:thermometer
  icon_selected: mdi:thermometer
  label: Confort
- url: /arrel-pruebas/laboratorio
  icon: mdi:tune-variant
  icon_selected: mdi:tune
  label: Pruebas
styles: |
  /* Arrel: mismos fondos y radios que las habitaciones. */
  .navbar-card,
  .navbar-card.desktop,
  .navbar-card.mobile,
  .media-player {
    background: var(--arrel-room-background, var(--card-background-color));
    border: none;
    border-radius: 24px;
    box-shadow: none;
  }
  .navbar-card {
    --navbar-route-icon-size: 25px;
  }
  .route {
    min-width: 48px;
    min-height: 48px;
  }
  .button,
  .popup-item .button {
    border-radius: 16px;
    background: var(--arrel-room-icon-background, var(--secondary-background-color));
    box-shadow: none;
  }
  .button.active {
    background: var(--arrel-navigation-active-background, var(--secondary-background-color));
  }
  .icon {
    color: var(--primary-text-color);
  }
  .icon.active {
    color: var(--primary-color);
  }
  .label {
    color: var(--secondary-text-color);
    font-size: 12px;
    font-weight: 500;
  }
  .label.active {
    color: var(--primary-color);
    font-weight: 600;
  }
  .popup-item.popuplabelbackground .label {
    background: var(--arrel-room-background, var(--card-background-color));
    border-radius: 16px;
    box-shadow: none;
  }
  .media-player-progress-bar {
    background: var(--arrel-slider-track-background, var(--secondary-background-color));
    box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18));
  }
  .route:focus-visible,
  .button:focus-visible {
    outline: 2px solid var(--primary-color);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .navbar-card, .route, .button, .icon, .label {
      transition: none !important;
      animation: none !important;
    }
  }
