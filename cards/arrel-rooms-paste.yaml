# COPIA TODO ESTE ARCHIVO EN UNA TARJETA MANUAL.
# Requiere Bubble Card >= 3.2.0 y card-mod.
# Generado por scripts/build_rooms_card.py; no usa !include.
type: custom:mod-card
card_mod:
  style: |
    ha-card {
      background: var(--card-background-color);
      border: none;
      border-radius: 24px;
      padding: 12px 16px 20px;
      box-shadow: none;
      --vertical-stack-card-gap: 12px;
      --grid-card-gap: 12px;
    }
card:
  type: vertical-stack
  cards:
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Habitaciones
    icon: mdi:floor-plan
    show_icon: false
    button_action:
      tap_action:
        action: none
    styles: |
      .bubble-button-card-container {
        background: transparent !important; border: none !important;
      }
      .bubble-name { font-size: 18px !important; font-weight: 600 !important; }

      .bubble-sub-button { border-radius: 18px !important; }
      ${(() => {
        const rooms = (this.config.arrel_rooms || []).map(list => Object.assign({}, ...list));
        const known = entity => entity && !['unknown','unavailable',''].includes(entity.state);
        const temperatures = rooms.map(room => hass.states[room.temperature]).filter(known).filter(item => Number.isFinite(Number(item.state)));
        const units = new Set(temperatures.map(item => item.attributes?.unit_of_measurement || '°C'));
        const average = temperatures.length && units.size === 1 ? Math.round(temperatures.reduce((sum,item) => sum + Number(item.state), 0) / temperatures.length * 10) / 10 + [...units][0] : '—';
        const windows = rooms.map(room => hass.states[room.window]);
        const open = windows.filter(item => item?.state === 'on').length;
        const unknown = windows.some(item => !item || !['on','off'].includes(item.state));
        const labels = card.querySelectorAll('.bubble-sub-button-name');
        if (labels[0]) labels[0].textContent = String(average);
        if (labels[1]) labels[1].textContent = open + (unknown ? ' ?' : '');
        return '';
      })()}
    arrel_rooms:
    - - area: salon
      - name: Salón
      - icon: mdi:sofa
      - temperature: sensor.salon_temperatura
      - humidity: sensor.salon_humedad
      - presence: binary_sensor.salon_presencia
      - window: binary_sensor.salon_ventana
      - light: light.salon
    - - area: dormitorio
      - name: Dormitorio
      - icon: mdi:bed
      - temperature: sensor.dormitorio_temperatura
      - humidity: sensor.dormitorio_humedad
      - presence: binary_sensor.dormitorio_presencia
      - window: binary_sensor.dormitorio_ventana
      - light: light.dormitorio
    - - area: despacho
      - name: Despacho
      - icon: mdi:desk
      - temperature: sensor.despacho_temperatura
      - humidity: sensor.despacho_humedad
      - presence: binary_sensor.despacho_presencia
      - window: binary_sensor.despacho_ventana
      - light: light.despacho
    - - area: bano
      - name: Baño
      - icon: mdi:bathtub
      - temperature: sensor.bano_temperatura
      - humidity: sensor.bano_humedad
      - presence: binary_sensor.bano_presencia
      - window: binary_sensor.bano_ventana
      - light: light.bano
    sub_button:
    - name: —
      icon: mdi:thermometer
      show_name: true
      show_background: true
      tap_action:
        action: none
    - name: —
      icon: mdi:window-open-variant
      show_name: true
      show_background: true
      tap_action:
        action: none
  - type: grid
    columns: 2
    square: false
    cards:
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.salon_temperatura
        name: Salón
        icon: mdi:sofa
        show_state: true
        scrolling_effect: false
        card_layout: large
        rows: 2.75
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#room-salon'
        tap_action:
          action: navigate
          navigation_path: '#room-salon'
        styles: |
          .bubble-button-card-container {
            height: 154px !important;
            border-radius: 24px !important;
            background: var(--arrel-room-background, var(--secondary-background-color)) !important;
            border: none !important;
          }
          .bubble-button-card { height: 154px !important; }
          .bubble-button-background { opacity: 0 !important; }
          .bubble-icon-container {
            position: absolute !important;
            top: 16px; left: 16px;
            width: 48px !important; height: 48px !important;
            border-radius: 16px !important;
            background: var(--arrel-room-icon-background, var(--card-background-color)) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
          }
          .bubble-icon {
            color: var(--primary-text-color) !important;
            --mdc-icon-size: 25px;
          }
          .bubble-name-container {
            position: absolute !important;
            top: 82px; left: 16px; right: 12px;
            margin: 0 !important; padding: 0 !important;
            width: auto !important;
          }
          .bubble-name { font-size: 16px !important; font-weight: 600 !important; }
          .bubble-state {
            display: block !important; font-size: 12px !important;
            color: var(--secondary-text-color) !important;
            opacity: 1 !important; margin-top: 7px;
            white-space: normal !important;
          }
          .bubble-button-card-container::after {
            content: '›'; position: absolute; top: 23px; right: 20px;
            font-size: 28px; color: var(--secondary-text-color); pointer-events: none;
          }
          .bubble-name-container::before {
            content: ''; position: absolute; top: 31px; left: 0;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--arrel-room-presence, var(--disabled-text-color));
          }
          .bubble-state { padding-left: 15px; }
          @media (max-width: 370px) {
            .bubble-name { font-size: 14px !important; }
            .bubble-state { font-size: 11px !important; }
          }
          ${(() => {
            const read = id => hass.states[id];
            const value = id => {
              const item = read(id);
              if (!item || ['unknown', 'unavailable', ''].includes(item.state)) return '—';
              const number = Number(item.state);
              return Number.isFinite(number) ? String(Math.round(number * 10) / 10) : '—';
            };
            const area = hass.areas?.['salon'];
            const name = card.querySelector('.bubble-name');
            if (name) name.textContent = area?.name || 'Salón';
            const stateText = card.querySelector('.bubble-state');
            const temp = read('sensor.salon_temperatura');
            const unit = temp?.attributes?.unit_of_measurement || '°C';
            const windowState = read('binary_sensor.salon_ventana')?.state;
            const windowText = windowState === 'on' ? ' ▣' : windowState === 'off' ? '' : ' ?';
            if (stateText) stateText.textContent = value('sensor.salon_temperatura') + unit + ' | ' + value('sensor.salon_humedad') + '%' + windowText;
            const container = card.querySelector('.bubble-button-card-container');
            const occupied = read('binary_sensor.salon_presencia')?.state;
            container?.style.setProperty('--arrel-room-presence', occupied === 'on' ? 'var(--primary-color)' : 'var(--disabled-text-color)');
            container?.setAttribute('title', (occupied === 'on' ? 'Presencia detectada' : occupied === 'off' ? 'Sin presencia' : 'Presencia sin datos') + ' · ' + (windowState === 'on' ? 'Ventana abierta' : windowState === 'off' ? 'Ventana cerrada' : 'Ventana sin datos'));
            const iconElement = card.querySelector('.bubble-icon');
            if (iconElement) iconElement.style.setProperty('color', read('light.salon')?.state === 'on' ? 'var(--arrel-room-light-color, var(--warning-color))' : 'var(--primary-text-color)', 'important');
            return '';
          })()}
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#room-salon'
        name: Salón
        icon: mdi:sofa
        show_close_button: true
        cards:
        - type: custom:bubble-card
          card_type: separator
          name: Iluminación
          icon: mdi:lightbulb-outline
        - type: custom:bubble-card
          card_type: button
          button_type: switch
          entity: light.salon
          name: Luz principal
          show_state: true
          scrolling_effect: false
          tap_action:
            action: toggle
          button_action:
            tap_action:
              action: toggle
        - type: custom:bubble-card
          card_type: separator
          name: Ambiente
          icon: mdi:thermometer
        - type: custom:bubble-card
          card_type: button
          button_type: state
          entity: sensor.salon_temperatura
