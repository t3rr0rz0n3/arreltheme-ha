# EDITA SOLO arrel_rooms EN LA CABECERA: área y entidades por habitación.
# Las referencias YAML *id001, etc. reutilizan esas variables en la cuadrícula.
type: custom:mod-card
card_mod:
  style: |
    ha-card {
      background: var(--card-background-color);
      border: none;
      border-radius: 24px;
      padding: 12px 16px 20px;
      box-shadow: none;
      --vertical-stack-card-gap: 12px;
      --grid-card-gap: 12px;
    }
card:
  type: vertical-stack
  cards:
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Habitaciones
    icon: mdi:floor-plan
    show_icon: false
    button_action:
      tap_action:
        action: none
    styles: |
      .bubble-button-card-container {
        background: transparent !important; border: none !important;
      }
      .bubble-name { font-size: 18px !important; font-weight: 600 !important; }

      .bubble-sub-button { border-radius: 18px !important; }
      ${(() => {
        const rooms = (this.config.arrel_rooms || []).map(list => Object.assign({}, ...list));
        const known = entity => entity && !['unknown','unavailable',''].includes(entity.state);
        const temperatures = rooms.map(room => hass.states[room.temperature]).filter(known).filter(item => Number.isFinite(Number(item.state)));
        const units = new Set(temperatures.map(item => item.attributes?.unit_of_measurement || '°C'));
        const average = temperatures.length && units.size === 1 ? Math.round(temperatures.reduce((sum,item) => sum + Number(item.state), 0) / temperatures.length * 10) / 10 + [...units][0] : '—';
        const windows = rooms.map(room => hass.states[room.window]);
        const open = windows.filter(item => item?.state === 'on').length;
        const unknown = windows.some(item => !item || !['on','off'].includes(item.state));
        const labels = card.querySelectorAll('.bubble-sub-button-name');
        if (labels[0]) labels[0].textContent = String(average);
        if (labels[1]) labels[1].textContent = open + (unknown ? ' ?' : '');
        return '';
      })()}
    arrel_rooms:
    - &id001
      - area: salon
      - name: Salón
      - icon: mdi:sofa
      - temperature: sensor.salon_temperatura
      - humidity: sensor.salon_humedad
      - presence: binary_sensor.salon_presencia
      - window: binary_sensor.salon_ventana
      - light: light.salon
    - &id002
      - area: dormitorio
      - name: Dormitorio
      - icon: mdi:bed
      - temperature: sensor.dormitorio_temperatura
      - humidity: sensor.dormitorio_humedad
      - presence: binary_sensor.dormitorio_presencia
      - window: binary_sensor.dormitorio_ventana
      - light: light.dormitorio
    - &id003
      - area: despacho
      - name: Despacho
      - icon: mdi:desk
      - temperature: sensor.despacho_temperatura
      - humidity: sensor.despacho_humedad
      - presence: binary_sensor.despacho_presencia
      - window: binary_sensor.despacho_ventana
      - light: light.despacho
    - &id004
      - area: bano
      - name: Baño
      - icon: mdi:bathtub
      - temperature: sensor.bano_temperatura
      - humidity: sensor.bano_humedad
      - presence: binary_sensor.bano_presencia
      - window: binary_sensor.bano_ventana
      - light: light.bano
    sub_button:
    - name: —
      icon: mdi:thermometer
      show_name: true
      show_background: true
      tap_action:
        action: none
    - name: —
      icon: mdi:window-open-variant
      show_name: true
      show_background: true
      tap_action:
        action: none
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:decluttering-card
      template: arrel_room
      variables: *id001
    - type: custom:decluttering-card
      template: arrel_room
      variables: *id002
    - type: custom:decluttering-card
      template: arrel_room
      variables: *id003
    - type: custom:decluttering-card
      template: arrel_room
      variables: *id004
