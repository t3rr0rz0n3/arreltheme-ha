# COPIA TODO EN UNA TARJETA MANUAL; duplica y edita las entidades directamente.
# Requiere Bubble Card >= 3.2.0; este ejemplo también usa Better Thermostat UI Card y Mushroom.
# hash debe coincidir con los navigation_path de la habitación.
# Añade o elimina controles en cards. No necesita Config Template Card.
type: custom:bubble-card
card_type: pop-up
hash: '#menjador'
name: Salón
icon: mdi:sofa
show_close_button: true
cards:
- type: custom:bubble-card
  card_type: separator
  name: Iluminación
  icon: mdi:lightbulb-outline
- type: horizontal-stack
  cards:
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    slider_value_position: right
    slider_live_update: false
    entity: light.bulb_menjador_sofa_zigbee
    name: Luz Sofa
    scrolling_effect: false
    tap_action:
      action: toggle
    button_action:
      tap_action:
        action: toggle
    state_content: state
    styles: |
      .bubble-button-card-container {
        background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important;
        box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important;
      }
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    slider_value_position: right
    slider_live_update: false
    entity: light.bulb_menjador_aux_zigbee
    name: Luz Aux
    scrolling_effect: false
    tap_action:
      action: toggle
    button_action:
      tap_action:
        action: toggle
    state_content: state
    styles: |
      .bubble-button-card-container {
        background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important;
        box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important;
      }
- type: custom:bubble-card
  card_type: button
  button_type: slider
  slider_value_position: right
  slider_live_update: false
  entity: light.leds_tv_zigbee
  name: Leds Tv
  scrolling_effect: false
  tap_action:
    action: toggle
  button_action:
    tap_action:
      action: toggle
  state_content: state
  styles: |
    .bubble-button-card-container {
      background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important;
      box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important;
    }
- type: custom:bubble-card
  card_type: separator
  name: Ambiente
  icon: mdi:thermometer
- type: horizontal-stack
  cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.temperature_menjador_zigbee_temperature
    name: Temperatura
    scrolling_effect: false
    state_content: state
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.temperature_menjador_zigbee_humidity
    name: Humedad
    scrolling_effect: false
    state_content: state
- type: horizontal-stack
  cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: binary_sensor.presence_menjador_zigbee_occupancy
    name: Presencia
    scrolling_effect: false
    state_content: state
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: binary_sensor.door_casa_zigbee_contact
    name: Ventana
    scrolling_effect: false
    state_content: state
- type: custom:bubble-card
  card_type: separator
  name: Enchufes
  icon: mdi:power-plug
- type: horizontal-stack
  cards:
  - type: custom:bubble-card
    card_type: button
    button_type: switch
    entity: switch.smartplug_salon_vacuum_tuya
    name: Enchufe Mayormono
    scrolling_effect: false
    tap_action:
      action: toggle
    button_action:
      tap_action:
        action: toggle
    state_content: state
  - type: custom:bubble-card
    card_type: button
    button_type: switch
    entity: switch.smartplug_salon_tv_tuya
    name: Enchufe TV
    scrolling_effect: false
    tap_action:
      action: toggle
    button_action:
      tap_action:
        action: toggle
    state_content: state
- type: custom:bubble-card
  card_type: separator
  name: Calefacció
  icon: mdi:heating-coil
- type: custom:better-thermostat-normal-climate-card
  entity: climate.termostat_menjador_zigbee
  low_battery_threshold: 10
  name: Termostat
  window_sensor: binary_sensor.window_menjador_zigbee_contact
  humidity_sensor: sensor.temperature_menjador_zigbee_humidity
  show_current_as_primary: false
  show_secondary: true
  colors:
    heat: deep-purple
- type: custom:bubble-card
  card_type: separator
  name: Purificador de aire
  icon: mdi:air-purifier
- type: tile
  entity: fan.xiaomi_cpa4_9375_air_purifier
  features:
  - type: fan-speed
  grid_options:
    columns: 12
    rows: 2
- type: custom:mushroom-chips-card
  chips:
  - type: entity
    entity: sensor.xiaomi_cpa4_9375_pm25_density
    content_info: state
    icon_color: green
  - type: entity
    entity: sensor.xiaomi_cpa4_9375_filter_left_time
    icon_color: yellow
  - type: entity
    entity: sensor.xiaomi_cpa4_9375_filter_used_time
  - type: template
    entity: sensor.xiaomi_cpa4_9375_filter_life_level
    icon_color: |-
      {% set level = states(entity) | float %} {% if level > 80 %}
        green
      {% elif level > 40 %}
        orange
      {% else %}
        red
      {% endif %}
    icon: mdi:chart-line
    content: |
      {{ states('sensor.xiaomi_cpa4_9375_filter_life_level') }} %
