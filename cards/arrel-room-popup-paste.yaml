# COPIA TODO EN UNA TARJETA MANUAL. Edita solo variables.
# Requiere Bubble Card >= 3.2.0 y Config Template Card.
# Better Thermostat UI Card solo si configuras climate.
# Una entidad vacía ("''") omite el control y, si procede, su sección.
# Tres luces y dos enchufes opcionales, agrupados en filas de dos.
type: custom:config-template-card
variables:
  popup_id: "'#room-cocina'"
  room_name: "'Cocina'"
  room_icon: "'mdi:countertop-outline'"
  temperature: "''"
  humidity: "''"
  presence: "''"
  window: "''"
  light_1: "''"
  light_2: "''"
  light_3: "''"
  plug_1: "''"
  plug_2: "''"
  climate: "''"
  climate_window: "''"
  purifier: "''"
  light_1_name: "'Luz 1'"
  light_2_name: "'Luz 2'"
  light_3_name: "'Luz 3'"
  plug_1_name: "'Enchufe 1'"
  plug_2_name: "'Enchufe 2'"
  window_name: "'Ventana'"
entities:
- ${temperature}
- ${humidity}
- ${presence}
- ${window}
- ${light_1}
- ${light_2}
- ${light_3}
- ${plug_1}
- ${plug_2}
- ${climate}
- ${climate_window}
- ${purifier}
card:
  type: custom:bubble-card
  card_type: pop-up
  hash: ${popup_id}
  name: ${room_name}
  icon: ${room_icon}
  show_close_button: true
  cards: |-
    ${(() => {
      const result = [];
      const present = entity => typeof entity === 'string' && entity.trim() !== '';
      const separator = (name, icon) => ({type: 'custom:bubble-card', card_type: 'separator', name, icon});
      const button = (entity, name, kind) => {
        const config = {type: 'custom:bubble-card', card_type: 'button', button_type: kind,
          entity, name, show_state: true, scrolling_effect: false};
        if (kind !== 'state') {
          config.tap_action = {action: 'toggle'};
          config.button_action = {tap_action: {action: 'toggle'}};
        }
        if (kind === 'slider') {
          config.slider_value_position = 'right';
          config.slider_live_update = false;
          config.styles = '.bubble-button-card-container { background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important; box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important; }';
        }
        return config;
      };
      const section = (name, icon, entries, kind) => {
        const items = entries.filter(([entity]) => present(entity)).map(([entity, label]) => button(entity, label, kind));
        if (!items.length) return;
        result.push(separator(name, icon));
        for (let i = 0; i < items.length; i += 2) {
          const pair = items.slice(i, i + 2);
          result.push(pair.length === 2 ? {type: 'horizontal-stack', cards: pair} : pair[0]);
        }
      };
      section('Iluminación', 'mdi:lightbulb-outline', [[light_1, light_1_name], [light_2, light_2_name], [light_3, light_3_name]], 'slider');
      section('Ambiente', 'mdi:thermometer', [[temperature, 'Temperatura'], [humidity, 'Humedad'], [presence, 'Presencia'], [window, window_name]], 'state');
      section('Enchufes', 'mdi:power-plug', [[plug_1, plug_1_name], [plug_2, plug_2_name]], 'switch');
      if (present(climate)) {
        const thermostat = {type: 'custom:better-thermostat-normal-climate-card', entity: climate,
          name: 'Termostat', low_battery_threshold: 10, show_current_as_primary: false,
          show_secondary: true, colors: {heat: 'deep-purple'}};
        if (present(climate_window)) thermostat.window_sensor = climate_window;
        if (present(humidity)) thermostat.humidity_sensor = humidity;
        result.push(separator('Calefacción', 'mdi:heating-coil'), thermostat);
      }
      if (present(purifier)) {
        result.push(separator('Purificador de aire', 'mdi:air-purifier'),
          {type: 'tile', entity: purifier, features: [{type: 'fan-speed'}]});
      }
      if (!result.length) result.push({type: 'markdown', content: 'Configura las entidades en variables para añadir controles a esta habitación.'});
      return result;
    })()}
