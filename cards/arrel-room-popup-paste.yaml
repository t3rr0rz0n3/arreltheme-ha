# COPIA TODO EN UNA TARJETA MANUAL; duplica para cada habitación.
# Requiere Bubble Card >= 3.2.0 y Config Template Card.
# Edita variables. popup_id debe coincidir con navigation_path de la habitación.
# Base: una bombilla, temperatura, puerta, ventana y presencia.
# Añade otros controles manualmente dentro de card.cards.
type: custom:config-template-card
variables:
  popup_id: "'#room-salon'"
  room_name: "'Salón'"
  room_icon: "'mdi:sofa'"
  light: "'light.salon'"
  temperature: "'sensor.salon_temperatura'"
  door: "'binary_sensor.salon_puerta'"
  window: "'binary_sensor.salon_ventana'"
  presence: "'binary_sensor.salon_presencia'"
entities:
- ${light}
- ${temperature}
- ${door}
- ${window}
- ${presence}
card:
  type: custom:bubble-card
  card_type: pop-up
  hash: ${popup_id}
  name: ${room_name}
  icon: ${room_icon}
  show_close_button: true
  cards:
  - type: custom:bubble-card
    card_type: separator
    name: Iluminación
    icon: mdi:lightbulb-outline
  - type: custom:bubble-card
    card_type: button
    button_type: slider
    entity: ${light}
    name: Luz principal
    show_state: true
    scrolling_effect: false
    slider_value_position: right
    slider_live_update: false
    tap_action:
      action: toggle
    button_action:
      tap_action:
        action: toggle
    styles: |
      .bubble-button-card-container {
        background: var(--arrel-slider-track-background, var(--secondary-background-color)) !important;
        box-shadow: var(--arrel-slider-track-shadow, inset 0 2px 6px rgba(0,0,0,.18)) !important;
      }
  - type: custom:bubble-card
    card_type: separator
    name: Ambiente
    icon: mdi:thermometer
  - type: horizontal-stack
    cards:
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: ${temperature}
      name: Temperatura
      show_state: true
      scrolling_effect: false
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: ${presence}
      name: Presencia
      show_state: true
      scrolling_effect: false
  - type: horizontal-stack
    cards:
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: ${door}
      name: Puerta
      show_state: true
      scrolling_effect: false
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: ${window}
      name: Ventana
      show_state: true
      scrolling_effect: false
